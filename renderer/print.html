<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Bookich PDF</title>
  <link rel="stylesheet" href="styles.css" />
  <style id="page-style"></style>
  <style>
    html, body { overflow: visible; height: auto; background: #fff; user-select: text; }
    body { font-size: 11pt; }
    .print-cover { page: cover; position: relative; break-after: page; overflow: hidden; }
    .print-cover .cover { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
    .print-cover .cover .cover-text { padding: 14mm 14mm; }
    .print-cover .cover .cover-title { font-size: 34pt; }
    .print-cover .cover .cover-sub { font-size: 15pt; margin-top: 6mm; }
    .print-cover .cover .cover-author { font-size: 11pt; }
    .print-cover .cover-shine { display: none; }
    .print-front { break-after: page; }
    .print-front h1 { font: 700 22pt/1.2 var(--font-display); margin-bottom: 4mm; }
    .print-front .ann { font-family: var(--font-serif); font-size: 11.5pt; line-height: 1.6; color: #3a4b63; margin-bottom: 10mm; }
    .print-front .tags { margin-bottom: 10mm; display: flex; gap: 6px; flex-wrap: wrap; }
    .print-toc .tc { display: flex; gap: 10px; padding: 2.4mm 0; border-bottom: 1px solid #e2eaf4; font-weight: 600; font-size: 11pt; }
    .print-toc .tc .n { color: #2479f2; min-width: 8mm; }
    .print-toc .ts { padding: 1mm 0 1mm 10mm; font-size: 9.5pt; color: #6b7b93; }
    .print-chapter { break-before: page; }
    .print-chapter:first-of-type { break-before: auto; }
    .print-chapter .eyebrow { font-size: 9pt; margin-bottom: 3mm; }
    .print-chapter h1.ct { font: 700 22pt/1.2 var(--font-display); margin-bottom: 4mm; letter-spacing: -.02em; }
    .print-chapter .cs { color: #6b7b93; font-size: 10.5pt; margin-bottom: 8mm; padding-bottom: 6mm; border-bottom: 1px solid #e2eaf4; }
    .print-chapter .chap-img { box-shadow: none; max-height: 90mm; object-fit: cover; margin-bottom: 8mm; }
    .md { --fs: 11pt; max-width: none; line-height: 1.62; }
    .md h2.sec-title { break-after: avoid; }
    .md h3, .md h4 { break-after: avoid; }
    .md figure.diagram, .md table, .md pre, .md .callout, .md img { break-inside: avoid; }
    .md figure.diagram svg { max-height: 120mm; }
    .md p { orphans: 3; widows: 3; }
  </style>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script type="module" src="js/print.js"></script>
</head>
<body><div id="root"></div></body>
</html>
